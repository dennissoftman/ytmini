name: Release

# release-please keeps a release PR (version bump + CHANGELOG.md) up to date
# from Conventional Commits on master. Merging it tags vX.Y.Z and creates the
# GitHub release; the build jobs then attach the macOS, Windows and Linux
# packages and SHA256SUMS.txt.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild and re-upload the packages for an existing tag (e.g. v0.1.14)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    # Homebrew's libraries require the macOS version they were built on, so
    # this runner sets the app's minimum macOS (bundle.sh writes it to Info.plist).
    runs-on: macos-15
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      # Developer ID signing + notarization run only when these secrets exist;
      # without them the app is ad-hoc signed (see CONTRIBUTING.md, "Signing").
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: Build tools
        run: |
          brew install mpv llvm lld makensis jq
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Signing keychain
        if: env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw=$(openssl rand -hex 24)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: macOS app
        run: ./bundle.sh

      - name: Notarize
        if: env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          ditto -c -k --keepParent dist/ytmini.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(jq -r .status "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" "${auth[@]}" || true
            exit 1
          fi
          xcrun stapler staple dist/ytmini.app
          spctl --assess --type execute -vv dist/ytmini.app
          rm -f "$key"

      - name: macOS zip
        run: |
          version="${TAG#v}"
          ditto -c -k --keepParent dist/ytmini.app "dist/ytmini-${version}-macos-arm64.zip"

      - name: Windows installer
        run: |
          ./scripts/build_windows.sh
          version="${TAG#v}"
          mv dist/ytmini-win64.zip "dist/ytmini-${version}-win64.zip"

      - name: Upload to the release
        run: |
          gh release upload "$TAG" --clobber \
            dist/ytmini-*-macos-arm64.zip \
            dist/ytmini-*-setup.exe \
            dist/ytmini-*-win64.zip

  build-linux:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    # The oldest runner sets the minimum glibc (2.35: Ubuntu 22.04, Debian 12).
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        run: ./scripts/build_linux.sh

      - name: Upload to the release
        run: |
          gh release upload "$TAG" --clobber \
            dist/ytmini-*-linux-x86_64.tar.gz \
            dist/ytmini_*_amd64.deb

  checksums:
    needs: [release-please, build, build-linux]
    if: >-
      always() && needs.build.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: SHA256SUMS.txt
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p 'ytmini-*' -p 'ytmini_*'
          sha256sum ytmini-* ytmini_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber SHA256SUMS.txt
