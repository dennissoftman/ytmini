[package]
name = "ytmini"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aes = "0.9"
anyhow = "1"
cbc = "0.2"
dirs = "5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.9.1"
pbkdf2 = { version = "0.13", features = ["hmac"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11.1"
arboard = { version = "3.7", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSPasteboard", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
