[package]
name = "ytmini"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.9.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication"] }
