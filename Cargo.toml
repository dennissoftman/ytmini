[package]
name = "ytmini"
version = "0.5.1"
edition = "2021"
description = "A small, fast desktop YouTube client for macOS, Windows and Linux (egui + libmpv)"
authors = ["Denys Mitin"]
license = "MIT"
repository = "https://github.com/dennissoftman/ytmini"
readme = "README.md"
publish = false

[dependencies]
aes = "0.9"
anyhow = "1"
cbc = "0.2"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.9.1"
pbkdf2 = { version = "0.13", features = ["hmac"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
sha1 = "0.11"
sha2 = "0.11.1"
arboard = { version = "3.7", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rsa = { version = "0.10.0", default-features = false, features = ["std", "pkcs1v15"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSPasteboard", "NSResponder", "NSImage", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSGeometry", "NSData"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "MPMediaItemCollection", "MPMediaEntity", "objc2-app-kit", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
